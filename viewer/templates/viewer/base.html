{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Case Law Extraction{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'viewer/css/tailwind.css' %}">
  {# component scripts MUST load before Alpine so factories register #}
  <script defer src="{% static 'viewer/js/components/page_viewer.js' %}"></script>
  <script defer src="{% static 'viewer/js/vendor/alpine-csp.min.js' %}"></script>
</head>
<body class="min-h-screen bg-neutral-50 text-neutral-900">
  <header class="sticky top-0 z-30 border-b border-neutral-200 bg-white">
    <div class="mx-auto flex max-w-screen-2xl items-center gap-4 px-4 py-2">
      <a href="{% url 'home' %}"
         class="font-semibold tracking-tight text-neutral-900">
        Case Law Extraction
      </a>
      {% block header %}{% endblock %}
    </div>
  </header>
  <main class="mx-auto max-w-screen-2xl px-4 py-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
