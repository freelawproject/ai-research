[project]
name = "blocktagger-wordlevel"
version = "2.0.0"
description = "FLP case-law block tagger, word-level release: scoring script + results viewer"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=5.15",
    "huggingface_hub>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
