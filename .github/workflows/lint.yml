name: Lint

on:
  push:
    branches: [extraction_package]
  pull_request:
    branches: [extraction_package]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pre-commit run --all-files
      - run: uv run mypy extraction viewer pipeline
