[project]
name = "extraction"
version = "0.1.0"
description = "Case law extraction pipeline and walkthrough viewer"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.0.5,<6.1",
    "django-cotton>=2.7.2",
    "django-environ>=0.12",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pre-commit>=4",
    "mypy>=1.15",
    "django-stubs>=5.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# A pod kit is a FLAT directory: runpod/ ships to_images.py and friends
# beside the runner, so they are imported as top-level modules with no
# package to import them from. Declared first-party here or ruff files
# them as third-party and merges them into the torch/PIL block.
known-first-party = [
    "dots_common",
    "mistral_ocr",
    "postprocess",
    "split_volume",
    "to_images",
]
