[mypy]
plugins = mypy_django_plugin.main
ignore_missing_imports = True

[mypy.plugins.django-stubs]
django_settings_module = extraction.settings

[mypy-viewer.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-pipeline.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
